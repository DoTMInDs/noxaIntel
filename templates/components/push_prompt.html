{% if user.is_authenticated %}
<style>
  /* ── Push Prompt Toast ── */
  #push-prompt {
    position: fixed;
    bottom: calc(60px + 12px);
    left: 12px;
    right: 12px;
    z-index: 9999;

    display: flex;
    align-items: center;
    gap: 12px;

    background: linear-gradient(135deg, rgba(124,58,237,0.18), rgba(79,70,229,0.14));
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(124,58,237,0.35);
    border-radius: 16px;
    padding: 12px 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(124,58,237,0.1);

    animation: push-slide-in 0.38s cubic-bezier(0.34,1.3,0.64,1) both;
  }

  @media (min-width: 768px) {
    #push-prompt {
      bottom: 20px;
      right: 20px;
      left: auto;
      width: 340px;
    }
  }

  @keyframes push-slide-in {
    from { opacity: 0; transform: translateY(28px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }

  .push-prompt-icon {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(124,58,237,0.4);
  }

  .push-prompt-body { flex: 1; min-width: 0; }

  .push-prompt-body p {
    font-size: 12px; line-height: 1.4;
    color: rgba(255,255,255,0.8); margin: 0 0 8px;
  }

  .push-prompt-actions { display: flex; align-items: center; gap: 8px; }

  #enable-push {
    flex: 1; padding: 7px 14px;
    border-radius: 999px; border: none;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: transform 0.1s, box-shadow 0.15s;
    box-shadow: 0 3px 10px rgba(124,58,237,0.5);
    -webkit-tap-highlight-color: transparent;
  }
  #enable-push:active { transform: scale(0.96); }
  #enable-push:disabled { opacity: 0.6; cursor: not-allowed; }

  #push-dismiss {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.5); font-size: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  #push-dismiss:hover { background: rgba(255,255,255,0.15); }

  #push-status {
    font-size: 11px; font-weight: 600;
    margin-left: 4px; color: #4ade80;
  }
</style>

<div id="push-prompt" role="dialog" aria-label="Enable push notifications" style="display:none">
  <div class="push-prompt-icon">🔔</div>
  <div class="push-prompt-body">
    <p>Enable push notifications for real‑time match alerts.</p>
    <div class="push-prompt-actions">
      <button id="enable-push">Enable Alerts</button>
      <span id="push-status"></span>
      <button id="push-dismiss" aria-label="Dismiss">✕</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const VAPID_PUBLIC_KEY = "{{ VAPID_PUBLIC_KEY }}";
  const SUBSCRIBE_URL    = '{% url "notifications:push_subscribe" %}';
  const DISMISS_KEY      = 'noxa-push-dismissed';   // localStorage — persists across sessions
  const SUBSCRIBED_KEY   = 'noxa-push-subscribed';  // localStorage — marks a successful save

  const prompt     = document.getElementById('push-prompt');
  const enableBtn  = document.getElementById('enable-push');
  const statusEl   = document.getElementById('push-status');
  const dismissBtn = document.getElementById('push-dismiss');

  // ── Utilities ──────────────────────────────────────────────────────────────

  function urlBase64ToUint8Array(b64) {
    const padding = '='.repeat((4 - b64.length % 4) % 4);
    const base64  = (b64 + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw     = atob(base64);
    return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
  }

  function getCsrfToken() {
    const cookie = document.cookie.split('; ').find(r => r.startsWith('csrftoken='));
    return cookie ? cookie.split('=')[1] : '{{ csrf_token }}';
  }

  function hidePrompt(permanent) {
    if (permanent) {
      localStorage.setItem(DISMISS_KEY, '1');
      window.dispatchEvent(new Event('noxa-push-status-changed'));
    }
    prompt.style.transition = 'opacity 0.25s, transform 0.25s';
    prompt.style.opacity    = '0';
    prompt.style.transform  = 'translateY(16px)';
    setTimeout(() => { prompt.style.display = 'none'; }, 280);
  }

  function showPrompt() {
    prompt.style.display = 'flex';
    // Trigger animation reflow
    void prompt.offsetWidth;
    prompt.style.opacity   = '';
    prompt.style.transform = '';
  }

  // ── Wait for a live service worker ────────────────────────────────────────
  // Returns a promise that resolves with a ServiceWorkerRegistration.
  // Strategy: wait for `navigator.serviceWorker.ready` (guaranteed active SW),
  // then confirm pushManager is available before resolving.
  async function getReadySW() {
    if (!('serviceWorker' in navigator)) {
      throw new Error('Service Worker not supported');
    }

    // 1. Try to find an existing registration first to avoid ready hang
    let reg = await navigator.serviceWorker.getRegistration('/');
    if (!reg) {
      const regs = await navigator.serviceWorker.getRegistrations();
      if (regs && regs.length > 0) {
        reg = regs[0];
      }
    }

    // 2. If no registration exists, register it on the fly
    if (!reg) {
      console.log('[NoxaIntel Push] No active service worker found. Registering on the fly...');
      try {
        reg = await navigator.serviceWorker.register('{% url "pwa:serviceworker" %}', { scope: '/' });
      } catch (err) {
        throw new Error('Service Worker registration failed: ' + err.message);
      }
    }

    if (reg) {
      if (reg.active) {
        if (!reg.pushManager) throw new Error('PushManager not available on this SW registration');
        return reg;
      }
      const activeWorker = reg.active || reg.waiting || reg.installing;
      if (activeWorker) {
        await new Promise((resolve) => {
          if (activeWorker.state === 'activated') {
            resolve();
          } else {
            activeWorker.addEventListener('statechange', (e) => {
              if (e.target.state === 'activated') resolve();
            });
          }
        });
        if (!reg.pushManager) throw new Error('PushManager not available on this SW registration');
        return reg;
      }
    }

    // 2. Fallback to ready with a 6-second timeout so it never hangs indefinitely
    const readyPromise = navigator.serviceWorker.ready;
    const timeoutPromise = new Promise((_, reject) =>
      setTimeout(() => reject(new Error('Service Worker ready timeout')), 6000)
    );

    reg = await Promise.race([readyPromise, timeoutPromise]);
    if (!reg.pushManager) throw new Error('PushManager not available on this SW registration');
    return reg;
  }

  // ── Core subscribe flow ───────────────────────────────────────────────────
  async function subscribe(silent) {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
      if (!silent) statusEl.textContent = '❌ Not supported';
      return false;
    }

    try {
      // 1. Request permission FIRST to keep the user gesture context active.
      // Awaiting service worker ready beforehand destroys the user gesture activation on Safari/iOS.
      if (!silent) {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          statusEl.textContent = '❌ Denied';
          if (permission === 'denied') hidePrompt(true); // don't ask again
          return false;
        }
      } else if (Notification.permission !== 'granted') {
        // Silent mode but permission not yet granted — do nothing
        return false;
      }

      // 2. Now get the ready service worker and subscribe
      const reg = await getReadySW();

      // Check for an existing subscription first — avoid double-subscribing
      let subscription = await reg.pushManager.getSubscription();

      if (!subscription) {
        subscription = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });
      }

      // Save to server
      const resp = await fetch(SUBSCRIBE_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCsrfToken(),
        },
        body: JSON.stringify(subscription.toJSON()),
      });
      const data = await resp.json();

      if (data.status === 'ok') {
        localStorage.setItem(SUBSCRIBED_KEY, '1');
        window.dispatchEvent(new Event('noxa-push-status-changed'));
        if (!silent) {
          statusEl.textContent   = '✅';
          enableBtn.textContent  = 'Done!';
          setTimeout(() => hidePrompt(true), 1800);
        }
        return true;
      } else {
        throw new Error(data.message || 'Server error');
      }
    } catch (err) {
      console.error('[NoxaIntel Push] subscribe error:', err);
      // Clean up local storage subscription key on failure, since it's not valid on the server!
      localStorage.removeItem(SUBSCRIBED_KEY);
      window.dispatchEvent(new Event('noxa-push-status-changed'));

      if (!silent) {
        statusEl.textContent  = '❌ Failed';
        enableBtn.disabled    = false;
        enableBtn.textContent = 'Enable Alerts';
        alert('Push Subscription Failed:\n\nError: ' + err.message + '\n\nPlease screenshot this error.');
      }
      return false;
    }
  }

  // ── Initialisation ────────────────────────────────────────────────────────
  async function init() {
    // Skip entirely if browser doesn't support push or VAPID key is missing
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;
    if (!VAPID_PUBLIC_KEY) {
      console.warn('[NoxaIntel Push] VAPID_PUBLIC_KEY is not set. Push notifications disabled.');
      return;
    }

    // If already subscribed this browser — check if still valid
    if (localStorage.getItem(SUBSCRIBED_KEY)) {
      const success = await subscribe(true); // refresh silently
      if (success) {
        return;
      }
    }

    // If permission is already granted, silently re-subscribe in background
    // (ensures subscription is always up-to-date after token rotation)
    if (Notification.permission === 'granted') {
      await subscribe(true); // fire-and-forget
      return;          // don't show the prompt
    }

    // If the user permanently dismissed or permission was denied — do nothing
    if (localStorage.getItem(DISMISS_KEY) || Notification.permission === 'denied') return;

    // Show the prompt after a short delay (let the page settle)
    setTimeout(showPrompt, 1500);

    // Auto-dismiss after 10 s (but don't permanently dismiss — just session)
    let autoDismiss = setTimeout(() => hidePrompt(false), 10000);

    dismissBtn.addEventListener('click', () => {
      clearTimeout(autoDismiss);
      hidePrompt(true); // permanent dismiss via localStorage
    });

    enableBtn.addEventListener('click', async () => {
      clearTimeout(autoDismiss);
      enableBtn.disabled    = true;
      enableBtn.textContent = 'Requesting…';
      statusEl.textContent  = '';
      await subscribe(false);
    });
  }

  // Expose to window so other components can interact with push features
  window.noxaPush = {
    showPrompt: showPrompt,
    subscribe: subscribe,
    DISMISS_KEY: DISMISS_KEY,
    SUBSCRIBED_KEY: SUBSCRIBED_KEY
  };

  // Run after page fully loads so the service worker has time to register
  if (document.readyState === 'complete') {
    init();
  } else {
    window.addEventListener('load', init);
  }
})();
</script>
{% endif %}
